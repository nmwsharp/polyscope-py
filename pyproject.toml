[project]
name = "polyscope"
version = "2.6.1"
description = "Polyscope: A viewer and user interface for 3D data."
readme = "README.md"
license.file = "LICENSE"
authors = [
  { name = "Nicholas Sharp", email = "nmwsharp@gmail.com" },
]
maintainers = [
  {  name = "Nicholas Sharp", email = "nmwsharp@gmail.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"

dependencies = [
  "numpy",
  "typing_extensions"
]

[project.urls]
Homepage = "https://github.com/nmwsharp/polyscope"
Documentation = "https://polyscope.run"
"Bug Tracker" = "https://github.com/nmwsharp/polyscope/issues"
Discussions = "https://github.com/nmwsharp/polyscope/discussions"

[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"

# Required by nanobind for C++17. Technically it should be 10.14 
# for full support, but this seems to work and gets us somewhat older 
# compatibility.
# There is a matching setting in cibuildwheel_config.toml 
cmake.args = ["-DCMAKE_OSX_DEPLOYMENT_TARGET=10.13"]


## Local development with uv (see README)

[dependency-groups]
dev = [
  "ruff<0.16", # 0.16 enables many more rules by default
  "ty",
  # used by test/scripts/polyscope_demo.py
  "imageio",
  "libigl",
  "potpourri3d",
]

[tool.uv]
# `uv sync` and `uv run` install only the dependencies, not polyscope itself. During development
# the bindings are built with CMake, and an installed copy would shadow the local build.
# Another uv project depending on a local checkout of this repo must add `package = true` to
# that source in its [tool.uv.sources], or polyscope itself will not be installed.
package = false

## Misc tools and extensions

[tool.ty.src]
include = ["src", "test"]
exclude = ["test/scripts/*.py"] # ignore helper scripts for type checking

[tool.ty.analysis]
allowed-unresolved-imports = ["cupy", "cuda", "cuda.bindings.runtime"] # optional dependencies

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "test/**/*.py"]
exclude = ["test/scripts/*.py"] # ignore helper scripts for linting
line-length = 120